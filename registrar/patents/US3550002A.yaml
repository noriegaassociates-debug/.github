technical_scope:
  source_summary: >
    Communication and synchronization arrangements using periodic radio emissions
    from pulsars as remote reference signals. The patent discloses use of a pulsar
    signal to synchronize widely separated electronic devices and oscillators,
    maintain interferometric phase coherence, establish remote time standards,
    and encode/decode information for secure communications.
  source_disclosed_functions:
    - "Simultaneous observation of a selected pulsar at widely separated stations."
    - "Receiver/amplifier chains at remote sites."
    - "Control of local free-running oscillators using pulsar-derived timing."
    - "Phase-coherent long-baseline interferometer operation."
    - "Pulse multiplication/division to derive local clock signals."
    - "Use of pulsar signals as a coding/masking input for transmitted information."
    - "Correlation detection at the remote station using the same pulsar."
    - "Compensation for finite propagation delay between terrestrial stations."
  source_disclosed_components:
    - "Steerable receiving antennas 1/2 or 10/11"
    - "Receivers 14/15"
    - "Amplifiers 16/17"
    - "Local free-running oscillators 20/21"
    - "Phase-processing / position-processing block 22"
    - "Transmitting station 30"
    - "Tracking antenna 31"
    - "Message source 34"
    - "Mixer 35"
    - "Transmitter 36"
    - "Transmit antenna 37"
    - "Receiving station 40"
    - "Tracking antenna 41"
    - "Amplifier 43"
    - "Correlation detector 44"
    - "Receive antenna 46"

source_physical_chain_synchronization: >
  PULSAR EMISSION -> REMOTE ANTENNA -> RECEIVER -> AMPLIFIER ->
  LOCAL OSCILLATOR PHASE CORRECTION -> SYNCHRONIZED LOCAL TIME / PHASE STANDARD

source_physical_chain_secure_communication: >
  PULSAR SIGNAL f1(t) + MESSAGE S(t) -> MIXER / ENCODING ->
  TRANSMISSION -> REMOTE RECEIVER -> LOCAL PULSAR SIGNAL f2(t) ->
  CORRELATION PROCESSING -> RECOVERED INFORMATION SIGNAL

