technical_scope:
  source_summary: >
    Solid plant-fiber-containing composition and related methods for promoting
    anaerobic bioremediation of hydrophobic and otherwise recalcitrant contaminants
    in soils, sediments, wastes, sludges, ground water, surface water, and related
    environmental media. The source describes plant-derived sorptive media,
    electron-donor/electron-acceptor support, nutrient supply, anaerobic/redox
    conditioning, and optional microbial inoculum.
  source_disclosed_functions:
    - "Promote solid-phase extraction, absorption, and adsorption of hydrophobic contaminants."
    - "Create, enhance, and maintain anaerobic / reducing conditions."
    - "Provide carbonaceous co-substrates and nutrients."
    - "Provide electron acceptors for anaerobic microbial processes."
    - "Support indigenous contaminant-degrading microorganisms."
    - "Provide optional inoculum of legume-related, fiber-degrading, soil, and metal-reducing microorganisms."
    - "Support in-situ or ex-situ treatment."
    - "Permit pellet, tablet, capsule, granule, or briquette delivery forms."
    - "Support delayed / sustained interaction in submerged sediment applications."

source_disclosed_composition_architecture:
  component_a:
    role: "Primary nitrogen-fixing / leguminous or Phaeophyta plant material"
    source_reported_range: "20–97 wt%"
    examples_as_supplied:
      - "Lespedeza spp."
      - "Medicago spp. (alfalfa)"
      - "Vicia spp."
      - "Glycine spp."
      - "Lathyrus spp."
      - "Trifolium spp."
      - "Sargassum spp."
  component_b:
    role: "Fibrous plant material for sorption / extraction"
    source_reported_range: "3–80 wt%"
    examples_as_supplied:
      - "Gossypium-derived materials (cotton)"
      - "Cannabacea-derived materials (hops/hemp)"
  component_c:
    role: "Ammonium-free inorganic nitrogen / electron acceptor"
    source_reported_range: "0.5–30 wt%"
    examples_as_supplied:
      - "sodium nitrate"
      - "sodium-potassium nitrate"
      - "potassium nitrate"
      - "ferric nitrate"
  component_d:
    role: "Complex biologically hydrolyzable phosphorus"
    source_reported_range: "0.25–15 wt%"
    examples_as_supplied:
      - "ringed metaphosphates"
      - "linear polyphosphates"
  component_e:
    role: "Chelating / acidifying agent"
    source_reported_range: "0.01–5 wt%"
    examples_as_supplied:
      - "citric acid"
      - "humic acid"
      - "fulvic acid"
      - "sodium citrate"
      - "EDTA"
      - "NTA (claim text)"
  component_f:
    role: "Optional microbial inoculum"
    source_reported_range: "0.001–2 wt%"
    examples_as_supplied:
      - "Pseudomonas spp."
      - "Rhizobium spp."
      - "Bradyrhizobium spp."
      - "Fibrobacter spp."
      - "Clostridium spp."
      - "Geobacter spp."
      - "Thiobacillus spp."
      - "plant-fiber degrading fungi"
  component_g:
    role: "Optional additional plant-fiber / carbohydrate source"
    source_reported_range: "0.5–30 wt%"
    examples_as_supplied:
      - "Triticum-derived materials"
      - "Aegilops-derived materials"
      - "wheat"
      - "oats"
      - "barley"
      - "rye"

source_disclosed_environmental_state_chain: >
  CONTAMINATED MEDIA -> PLANT-FIBER SORPTION / EXTRACTION ->
  ANAEROBIC & REDUCING MICROENVIRONMENT -> MICROBIAL GROWTH / METABOLISM ->
  BIODEGRADATION / TRANSFORMATION / DETOXIFICATION -> REDUCED CONTAMINANT BURDEN

