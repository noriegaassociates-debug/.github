  rationale: >
    Relevant to historical reconstruction of alumina-resource recovery from
    post-service refractory brick, including contamination removal, carbon-assisted
    impurity control, electric-arc remelting, sphere formation and sorting,
    dual-output recovery into abrasive and fused-cast refractory products, and
    composition rebalancing before recasting.
  nmg_integration_state: "NOT YET MAPPED TO A SPECIFIC NMG ARCHITECTURE"

relationship_to_registered_patent:
  related_record: "NMG-PAT-CN106083000A-001"
  relationship: >
    Both records concern recovery of alumina ceramic waste, but they use materially
    different process architectures. CN106083000A centers on fine-powder
    reclamation, additive reconditioning, remolding, and re-sintering; CN103214250B
    centers on coarse waste-brick preprocessing, binder-assisted balling,
    electric-arc remelting, sphere formation/sorting, composition rebalance,
    and fused casting.
  authority_rule: "Related technical lineage does not merge inventorship, assignee authority, or claim scope."

