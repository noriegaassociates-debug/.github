technical_scope:
  source_summary: >
    Temperature-compensated ferromagnetic/ferrimagnetic resonator using a thin
    ferrimagnetic film, particularly a YIG thin film, together with a temperature
    detector, bias magnetic-field means, a compensation coil, and a compensation
    circuit containing precoded temperature-compensation data. The measured
    resonator temperature selects compensation data that controls additional
    magnetic field so resonance frequency remains stabilized over temperature.
  architecture_features:
    - "Ferrimagnetic thin-film resonator element, including YIG embodiments."
    - "Bias magnetic field applied perpendicular to the principal film surface."
    - "Temperature detector associated with the resonator element."
    - "Precoded compensation data stored in memory."
    - "A/D conversion of measured temperature in disclosed digital embodiment."
    - "D/A conversion or current-drive stage for compensation output."
    - "Compensation coil producing an additional magnetic field."
    - "Wide-variable-frequency operation with compensation independent of the principal tuning current."
  compensation_chain: >
    TEMPERATURE OF RESONATOR -> SENSOR -> DIGITAL TEMPERATURE VALUE ->
    PRECODED COMPENSATION DATA / ROM -> COMPENSATION CURRENT ->
    COMPENSATION COIL -> ADDITIONAL MAGNETIC FIELD -> RESONANCE STABILIZATION
  physical_principle_as_supplied: >
    Resonance frequency depends on applied bias field and temperature-dependent
    saturation magnetization. Compensation current is selected so the additional
    magnetic field offsets the temperature-dependent term rather than correcting
    resonance through an external varactor or separate frequency-control element.

source_claim_boundary:
  patent_claims_establish: >
    The disclosed arrangement and claimed use of measured temperature plus
    precoded compensation data to drive a compensation magnetic field for a
    ferrimagnetic resonator.
  patent_claims_do_not_establish:
    - "Independent replication."
    - "Present commercial implementation."
    - "NMG authorship or invention date."
    - "Universal compensation accuracy for all YIG resonators."
    - "Current legal enforceability."
    - "Validation of any NMG resonator or transformer architecture."

historical_lineage_role:
  proposed_role: "YIG / FERRIMAGNETIC RESONATOR CLOSED-LOOP TEMPERATURE-COMPENSATION PRIOR-ART RECORD"
  rationale: >
    Relevant to historical reconstruction of architectures in which physical
    temperature measurement is converted into stored calibration/compensation
    data and then returned through a controlled physical actuator to maintain a
    magnetic resonance state. This is a useful source for separating sensed
    environmental state, stored compensation model, drive current, magnetic
    field correction, and resulting physical resonance.
  nmg_integration_state: "NOT YET MAPPED TO A SPECIFIC NMG ARCHITECTURE"

