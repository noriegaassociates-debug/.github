historical_lineage_role:
  proposed_role: "CARBON-NANOFOAM MAGNETIC PRINT / MICR / READABLE-STRUCTURE PRIOR-ART RECORD"
  rationale: >
    Relevant to historical reconstruction of magnetic information encoding in
    printable material, where material composition carries a physically measurable
    magnetic state that is deposited onto a substrate and later read by a sensor.
    The record bridges magnetic-material formulation, printed geometry, physical
    signal persistence, and machine-readable interpretation.
  nmg_integration_state: "NOT YET MAPPED TO A SPECIFIC NMG ARCHITECTURE"

