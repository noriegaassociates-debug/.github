technical_scope:
  source_summary: >
    Magnetic ink and toner compositions using carbon nanofoam as the magnetic
    component, together with MICR processes and magnetically readable structures.
    The patent describes carbon nanofoam in fluid-carrier inks or polymeric
    toners, xerographic and inkjet-compatible processing, and use on checks,
    bank notes, currency, cards, inventory labels, and other substrates.
  functional_architecture:
    - "Magnetic composition containing carbon nanofoam."
    - "Fluid-carrier ink embodiments."
    - "Polymer-based toner embodiments."
    - "Optional dispersants, surfactants, colorants, waxes, coagulants, and charge-control additives."
    - "MICR character formation on a substrate."
    - "Magnetic scanning / character recognition."
    - "Magnetically readable structures beyond conventional paper documents."
  material_role:
    carbon_nanofoam: >
      Source-described ferromagnetic carbon allotrope used to replace some or all
      conventional magnetic particles and, in some embodiments, carbon-black pigment.
    disclosed_particle_size: "about 1–50 nm; embodiments about 5–10 nm"
    disclosed_loading: "about 0.1–45 wt%; embodiments include about 0.1–10 wt%"
  source_reported_magnetic_parameters:
    coercivity: "about 70–800 Oe; embodiments about 250–500 Oe"
    remanent_magnetization: "about 10–75 emu/g; embodiments about 23–39 emu/g"
    saturation_magnetization: "about 50–100 emu/g; embodiments about 70–90 emu/g"
  micr_signal_as_supplied:
    source_definition: "Adequate MICR described as about 50–130% of nominal signal"
    note: "Signal and jurisdictional thresholds are recorded as patent-stated claims, not independently verified here."

process_lineage:
  xerographic_chain: >
    LATENT ELECTROSTATIC IMAGE -> CARBON-NANOFOAM TONER DEPOSITION ->
    TRANSFER TO SUBSTRATE -> FIXING -> MAGNETICALLY READABLE IMAGE
  micr_chain: >
    CARBON-NANOFOAM MAGNETIC COMPOSITION -> RECOGNIZABLE CHARACTER ->
    MAGNETIC READING DEVICE -> SIGNAL / CHARACTER RECOGNITION
  inkjet_chain: >
    CARBON-NANOFOAM DISPERSION + CARRIER + DISPERSANT ->
    PRINTED MAGNETIC MARK -> DRYING -> MAGNETIC READOUT

