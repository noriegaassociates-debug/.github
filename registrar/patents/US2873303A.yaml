technical_scope:
  source_summary: >
    Photovoltaic device using a p-n junction formed from p-type and n-type
    aluminum antimonide (AlSb). One region is made thinner than the minority
    carrier diffusion length and exposed to incident visible radiation. The
    patent also describes anti-reflective coating, ohmic metal contacts, and
    connection to an external electrical load.
  source_disclosed_components:
    - "n-type aluminum antimonide portion 1"
    - "p-type aluminum antimonide portion 2"
    - "light-receiving surface 3"
    - "metal coatings / ohmic contacts 5 and 6"
    - "anti-reflecting coating 9"
    - "electrical load resistance 7"
    - "conductors 8 and 9"
  source_disclosed_functions:
    - "Conversion of visible / solar radiation to electrical power."
    - "Use of AlSb p-n junction rather than silicon, germanium, cadmium sulfide, selenium, or cuprous oxide."
    - "Light-receiving semiconductor region thinner than the minority-carrier diffusion length."
    - "Optional anti-reflective coating on illuminated surface."
    - "Alternative embodiments with either p-type or n-type layer on the illuminated side."
    - "Optional reverse-bias use for modulated-light photoelectric-cell operation."

source_physical_chain: >
  INCIDENT SOLAR / VISIBLE RADIATION -> AlSb LIGHT-RECEIVING REGION ->
  PHOTOGENERATED MINORITY CARRIERS -> p-n JUNCTION SEPARATION ->
  OHMIC CONTACTS -> EXTERNAL LOAD CURRENT

source_claim_boundary:
  patent_claims_establish: >
