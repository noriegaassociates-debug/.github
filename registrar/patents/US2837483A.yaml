technical_scope:
  source_summary: >
    Method for producing anisotropic permanent magnets based principally on
    hexagonal ferrite crystals of nominal composition MO·6Fe2O3, where M is
    barium, strontium, or lead, with limited calcium substitution. The process
    uses a mixture of presintered ferrite material and unreacted precursor
    oxides, magnetic orientation while the mixture is mobile, and final
    sintering to form a dense anisotropic magnet.
  process_stages_as_supplied:
    - "Prepare isotropic ferrite material from iron oxide and barium/strontium/lead oxide precursor."
    - "Magnetically orient the material while molding/pressing in a mobile or suspended state."
    - "Final sintering at elevated temperature to densify the oriented body."
  claimed_process_features_as_supplied:
    - "Use up to four times the weight of precursor oxide mixture relative to reacted permanent-magnetic material."
    - "Magnetically orient the magnetic material while the mixture is mobile."
    - "Sinter at about 1100–1400 C."
    - "Target body density at least 4."
    - "Principal crystal form: hexagonal ferrite."
  optional_modifiers_as_supplied:
    - "calcium oxide / calcium carbonate"
    - "barium oxide / barium carbonate / barium sulfate"
    - "lanthanum oxide"
    - "bismuth oxide"
    - "arsenic trioxide"
    - "antimony pentoxide"
    - "barium ferrite"
    - "calcium ferrite"

examples_as_supplied:
  example_I:
    precursor: "BaCO3 + Fe2O3, nominal molecular ratio 1:5.5"
    presintering: "about 1280 C"
    final_sintering: "about 1240–1250 C for about 10 min"
  example_II:
    modifier: "about 0.5 wt% CaCO3"
  example_III:
    precursor: "SrCO3 + Fe2O3"
    final_sintering: "about 1275 C"
  example_IV:
    final_sintering: "about 1270 C"

