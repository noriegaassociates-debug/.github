historical_lineage_role:
  proposed_role: "THERMOCHEMICAL ICE / FROZEN-SOIL PENETRATION PRIOR-ART RECORD"
  rationale: >
    Relevant to historical reconstruction of compact thermal penetration
    architectures where stored chemical potential is converted inside a
    confined reaction boundary into a directed thermal output for physical
    state change. The record is useful for studying chamber isolation,
    reactant-flow control, thermal transfer, melt-water recirculation,
    cyclic operation, and payload/penetrator geometry.
  nmg_integration_state: "NOT YET MAPPED TO A SPECIFIC NMG ARCHITECTURE"

