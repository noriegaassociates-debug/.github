technical_scope:
  source_summary: >
    Constant- or limited-current transformer architecture using an input winding,
    an intermediate winding, a load winding, controlled magnetic leakage paths,
    non-magnetic gaps, and a capacitor forming a resonant circuit with at least
    the intermediate winding. The patent describes regulation behavior in which
    the intermediate winding voltage remains substantially constant while output
    voltage falls as load current approaches a limited value.
  source_disclosed_components:
    - "Magnetic circuit / core 10"
    - "Straight core bar 11"
    - "Magnetic return path / yoke 12"
    - "Primary / input winding 13"
    - "Intermediate winding 16"
    - "Condenser / capacitor 19"
    - "Load winding 20"
    - "Leakage-reactance magnetic shunts 12b and 12c"
    - "Non-magnetic / air gaps 23"
    - "Auxiliary winding 24 in selected embodiments"
    - "Intermediate tap 26 in selected embodiment"
  source_disclosed_functions:
    - "Loose magnetic coupling between input and intermediate windings."
    - "Resonant operation of intermediate winding with capacitor."
    - "Substantially constant intermediate-winding voltage above a critical input condition."
    - "Controlled magnetic flux diversion through shunts."
    - "Load-current limitation through changing effective coupling and leakage reactance."
    - "Output-voltage collapse toward short circuit without excessive load-winding current."
    - "Selected embodiments use auxiliary winding compensation or autotransformer connections."

source_physical_chain: >
  AC INPUT -> PRIMARY MAGNETIZATION -> LEAKAGE-SHUNTED MAGNETIC COUPLING ->
  INTERMEDIATE RESONANT WINDING + CAPACITOR -> CONTROLLED FLUX DISTRIBUTION ->
  LOAD WINDING -> LIMITED / SELF-REGULATED CURRENT OUTPUT

