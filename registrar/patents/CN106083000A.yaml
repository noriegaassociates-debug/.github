technical_scope:
  source_summary: >
    Recycling process for alumina-ceramic waste, sintering bedding/padding,
    and sintering scrap. The disclosed process removes impurities, cleans,
    dries, crushes, fine-grinds the recovered material with processing aids,
    adds silica, magnesium, and kaolin, forms a cellular article, and sinters
    under vacuum or a protective atmosphere to create regenerated alumina
    ceramic material.
  process_stages_as_supplied:
    - "Remove impurities from alumina ceramic waste, sintering bedding/padding, and sintering scrap; clean, degrease, dry, and crush."
    - "Fine-grind to 2–6 micrometers with materials identified in the supplied English text as polypropylene acid, ammonia water, and drainage/water."
    - "Add silicon dioxide, magnesium, and kaolin."
    - "Vibrate/mix, rewet, and mold into cellular products."
    - "Sinter under protective atmosphere or vacuum."
    - "Break/process the sintered material to obtain regenerated alumina ceramic material."
  quantitative_parameters_as_supplied:
    fine_grinding_particle_size: "2–6 µm"
    waste_to_processing_aids_ratio: "10:2:1:3 as supplied"
    silicon_dioxide_addition: "1% of powder mass"
    magnesium_addition: "0.3% of powder mass"
    kaolin_addition: "5% of powder mass"
    vibration_time: "2 hours"
    sintering_temperature: "1350–1450 °C"
    hold_time: "2–4 hours"
    protective_atmosphere: "Nitrogen"
  embodiments_as_supplied:
    - "Example 1: 4 µm fine grinding; vacuum sintering at 1400 °C for 3 h."
    - "Example 2: 4 µm fine grinding; nitrogen sintering at 1450 °C for 3 h."
    - "Example 3: 5 µm fine grinding; vacuum sintering at 1450 °C for 2.5 h."

