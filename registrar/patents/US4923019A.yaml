technical_scope:
  source_summary: >
    Apparatus and method for penetrating ice, frozen soil, or other low-melting
    solid material using a confined thermochemical reaction chamber. An
    immobilized first reactant is contacted by an aqueous second reactant;
    the exothermic reaction produces hot liquid and/or steam that is discharged
    through a penetrator tip or nozzle to melt the surrounding material.
  architecture_features_as_supplied:
    - "Confined thermochemical reaction chamber."
    - "Substantially immobilized first thermochemical reactant."
    - "Controlled delivery of an aqueous second reactant."
    - "Discharge of hot aqueous reaction product and/or steam at the penetrator tip."
    - "Optional recirculation of melt water."
    - "Alternative two-stage arrangement in which melt water forms the reactive aqueous solution before entering the principal reaction chamber."
    - "Alternative cyclic / oscillating design using a shared inlet-outlet orifice."
    - "Thermally conductive end tip and localized thermal isolation."
  deployment_concepts_as_supplied:
    - "Surface-deployed reactor with tube/nozzle penetrating the ice."
    - "Elongated penetrator body moving through the melt channel."
    - "Downward or upward penetration depending on density/buoyancy and applied force."
    - "Instrumentation or payload passage through ice."

