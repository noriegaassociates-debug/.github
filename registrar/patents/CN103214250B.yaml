technical_scope:
  source_summary: >
    Recycling method for alumina refractory brick discarded after high-temperature
    service. The disclosed process mechanically removes surface impurities,
    crushes and sorts the waste brick, mixes the alumina-rich particulate with
    pitch binder, presses the mixture into balls, remelts it in an electric arc
    furnace, forms alumina spheres from the melt, sorts those spheres for abrasive
    use, and reblends nonconforming spheres with commercial alumina and soda ash
    for remelting and fused-cast alumina refractory brick production.
  process_stages_as_supplied:
    - "Mechanical cleaning and impurity removal from used alumina refractory brick."
    - "Crushing and sorting to particulate below 10 mm."
    - "Mixing waste-brick particulate with pitch binder."
    - "Pressing mixed material into approximately 30 mm balls."
    - "High-temperature electric-arc-furnace melting/smelting."
    - "Discharging molten material under high-pressure water to form alumina spheres."
    - "Drying and sorting spheres; qualifying complete spheres for abrasive use."
    - "Chemical-composition adjustment of sorted residual spheres with commercial alumina and soda ash."
    - "Second melting step followed by casting into refractory molds."
    - "Insulation annealing, cooling, finishing, cutting, and assembly."
  quantitative_parameters_as_supplied:
    preprocessed_particle_size: "<10 mm"
    waste_brick_fraction: "90–95%"
    pitch_binder_fraction: "5–10%"
    pressed_ball_size: "about 30 mm"
    first_arc_furnace_secondary_voltage: "110–220 V"
    first_arc_furnace_secondary_current: "1000–30000 A"
    first_smelting_cycle: "50–120 min"
    sphere_forming_water_pressure: "0.4–0.8 MPa"
    reblend_sphere_fraction: "70–90%"
    commercial_alumina_fraction: "10–25%"
    soda_ash_fraction: "≤10%"
    target_al2o3: "92–99%"
    target_sio2: "≤0.6%"
    target_na2o: "0.5–7%"
    second_melting_voltage: "120–240 V"
    second_melting_current: "1000–20000 A"
    second_melting_cycle: "40–120 min"
    insulation_annealing_time: "10–20 days as claimed; examples state 15–20 days"
  source_reported_outputs:
    - "Spherical alumina abrasive material."
    - "Fused-cast alumina refractory brick."

